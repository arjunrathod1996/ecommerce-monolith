<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Create Product</title>
</head>
<body>
<h1>Create Product</h1>
<form th:action="@{/ui/products}" th:object="${product}" method="post">
    <div>
        <label for="name">Name</label>
        <input type="text" id="name" th:field="*{name}" />
        <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    </div>
    <div>
        <label for="description">Description</label>
        <textarea id="description" th:field="*{description}"></textarea>
    </div>
    <div>
        <label for="price">Price</label>
        <input type="number" step="0.01" id="price" th:field="*{price}" />
        <div th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
    </div>
    <div>
        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" th:field="*{quantity}" />
        <div th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
    </div>
    <div>
        <button type="submit">Create</button>
    </div>
</form>
<p><a th:href="@{/ui/products}">Back to products</a></p>
</body>
</html>
