<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Users</title>
</head>
<body>
<h1>Users</h1>
<p><a th:href="@{/ui}">Home</a> | <a th:href="@{/ui/users/new}">Create User</a></p>
<div th:if="${success}">
    <p th:text="${success}" style="color:green"></p>
</div>
<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="u : ${users}">
        <td th:text="${u.id}">1</td>
        <td th:text="${u.name}">Name</td>
        <td th:text="${u.email}">email</td>
    </tr>
    </tbody>
</table>
</body>
</html>
